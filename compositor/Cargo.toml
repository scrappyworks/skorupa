# Separate workspace: Smithay and its dependency tree stay out of the lockfile
# that the lock, shell and sandbox processes build from.
#
# The lint tables repeat the ones in the top-level Cargo.toml, because Cargo
# cannot share them between workspaces. Change them together.
[workspace]
resolver = "3"
members = [".", "core"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/scrappyworks/skorupa"
publish = false

[workspace.dependencies]
proptest = { version = "1.9", default-features = false, features = ["std"] }
skorupa-compositor-core = { path = "core" }
skorupa-protocol = { path = "../protocol" }

[workspace.lints.rust]
# No exceptions. GPU bring-up goes through Smithay's `GbmGlesBackend`, which
# keeps the unsafe EGL and GLES constructor calls inside Smithay.
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
expect_used = "warn"
panic = "warn"
unwrap_used = "warn"

[package]
name = "skorupa-compositor"
description = "Wayland compositor for one screen."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
skorupa-compositor-core.workspace = true
skorupa-protocol.workspace = true
# Pinned to a full upstream commit, unpatched (REQ-DEP-001). X11, XWayland
# and calloop signals are kept out of the compositor.
smithay = { git = "https://github.com/Smithay/smithay", rev = "46643d204d61eef18bfb17faa814559af70504ed", default-features = false, features = [
  "backend_egl",
  "backend_gbm",
  "backend_libinput",
  "backend_session_libseat",
  "backend_udev",
  "desktop",
  "renderer_gl",
  "renderer_multi",
  "renderer_pixman",
  "wayland_frontend",
] }
# Structured log events. Already built for Smithay, so it adds no crate.
tracing = { version = "0.1.37", default-features = false, features = ["std"] }

[dev-dependencies]
# The test clients: real Wayland clients that talk to the compositor over a
# socket pair inside the test process. Only wayland-client is a new crate;
# rustix (memfd for wl_shm) and wayland-protocols are already built for
# Smithay.
rustix = { version = "1.0.7", default-features = false, features = ["fs", "std"] }
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client"] }

[lints]
workspace = true

[profile.release]
overflow-checks = true
